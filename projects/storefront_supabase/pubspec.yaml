name: storefront_supabase
description: "Ecommerce Storefront App - Modern Flutter-based storefront application for Supabase with BLoC state management, localization support, and responsive design"
publish_to: 'none' 

version: 1.0.0+3

environment:
  sdk: ^3.9.2


dependencies:
  flutter:
    sdk: flutter

  # ────────────────────────────────
  # CORE PACKAGE
  # ────────────────────────────────

  core:
    git:
      url: https://github.com/masterfabric-mobile/osmea.git
      ref: dev
      path: packages/core

  # ────────────────────────────────
  # ICONS
  # ────────────────────────────────
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.3

  # ────────────────────────────────
  # SUPABASE
  # ────────────────────────────────
  supabase_flutter: ^2.5.3


  # ────────────────────────────────  
  # DEPENDENCY INJECTION
  # ────────────────────────────────
  flutter_bloc: ^9.1.1     # BLoC pattern for managing application state
  get_it: ^8.3.0           # Simple service locator (manual DI)
  injectable: ^2.5.0       # Annotation-based code generation for get_it

  # ────────────────────────────────
  # ROUTING / NAVIGATION
  # ────────────────────────────────
  go_router: ^15.1.3       # Declarative navigation with deep linking support

  # ────────────────────────────────
  # ENVIRONMENT CONFIGURATION
  # ────────────────────────────────
  flavor: ^2.0.0           # Manage multiple environments (dev, staging, prod)

  # ────────────────────────────────
  # LOCALIZATION (i18n)
  # ────────────────────────────────
  flutter_gen: ^5.10.0     # Generates strongly typed asset references (images, fonts, etc.)
  intl: ^0.20.2
  image_picker: ^1.2.1
  flutter_localizations:
    sdk: flutter
  slang: ^4.11.1            # Slang for translations
  slang_flutter: ^4.11.0   # Slang Flutter integration
  url_launcher: ^6.3.2

  # ────────────────────────────────
  # CHARTS (Admin dashboard)
  # ────────────────────────────────
  fl_chart: ^0.69.0

# ═══════════════════════════════════════════════════════════════════════════════
# ═══════════════════════════════════════════════════════════════════════════════
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

  # ────────────────────────────────
  # CODE GENERATION
  # ────────────────────────────────
  injectable_generator: ^2.6.2     # Generates code for injectable (DI)
  build_runner: ^2.5.4            # Core tool for running code generation
  flutter_gen_runner: any         # Generator for flutter_gen (assets, colors, fonts, etc.)
  # Slang: use "dart run slang" (reads slang.yaml → lib/src/resources). Do NOT use slang_build_runner to avoid double output (lib/gen).

# ═══════════════════════════════════════════════════════════════════════════════
# APP ICON
# ═══════════════════════════════════════════════════════════════════════════════
flutter_launcher_icons:
  image_path: assets/images/app_icon.png
  android: true
  ios: true
  remove_alpha_ios: true

# ═══════════════════════════════════════════════════════════════════════════════
# FLUTTER GEN CONFIGURATION
# ═══════════════════════════════════════════════════════════════════════════════
flutter_gen:
  output: lib/gen/
  line_length: 80

# ═══════════════════════════════════════════════════════════════════════════════
# FLUTTER PROJECT CONFIGURATION
# ═══════════════════════════════════════════════════════════════════════════════

flutter:
# ────────────────────────────────
  # ASSET MANAGEMENT
  # ────────────────────────────────
  assets:
    - assets/                    # Configuration files (app_config.json)
    - assets/i18n/               # Localization files (slang)
  # ────────────────────────────────
  # MATERIAL DESIGN
  # ────────────────────────────────

  uses-material-design: true