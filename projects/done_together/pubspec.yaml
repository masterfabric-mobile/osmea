# ═══════════════════════════════════════════════════════════════════════════════
# PROJECT METADATA
# ═══════════════════════════════════════════════════════════════════════════════
name: done_together
description: "DoneTogether - Shared tasks and responsibilities for small groups (families, roommates, teams)."
publish_to: 'none'
version: 1.0.0+1

# ═══════════════════════════════════════════════════════════════════════════════
# ENVIRONMENT CONSTRAINTS
# ═══════════════════════════════════════════════════════════════════════════════
environment:
  sdk: ^3.9.2

# ═══════════════════════════════════════════════════════════════════════════════
# MAIN DEPENDENCIES
# ═══════════════════════════════════════════════════════════════════════════════
dependencies:
  # ────────────────────────────────
  # FLUTTER SDK
  # ────────────────────────────────
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ────────────────────────────────
  # LOCAL PACKAGES (monorepo)
  # ────────────────────────────────
  core:
    path: ../../packages/core

  # ────────────────────────────────
  # UI & ICONS
  # ────────────────────────────────
  cupertino_icons: ^1.0.8

  # ────────────────────────────────
  # SUPABASE
  # ────────────────────────────────
  supabase_flutter: ^2.5.3

  # ────────────────────────────────
  # STATE MANAGEMENT & DEPENDENCY INJECTION
  # ────────────────────────────────
  flutter_bloc: ^9.1.1
  get_it: ^8.3.0
  injectable: ^2.5.0

  # ────────────────────────────────
  # ROUTING / NAVIGATION
  # ────────────────────────────────
  go_router: ^15.1.3

  # ────────────────────────────────
  # ENVIRONMENT CONFIGURATION (FLAVORS)
  # ────────────────────────────────
  flavor: ^2.0.0

# ═══════════════════════════════════════════════════════════════════════════════
# DEVELOPMENT DEPENDENCIES
# ═══════════════════════════════════════════════════════════════════════════════
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  injectable_generator: ^2.6.2
  build_runner: ^2.5.4

# ═══════════════════════════════════════════════════════════════════════════════
# FLUTTER PROJECT CONFIGURATION
# ═══════════════════════════════════════════════════════════════════════════════
flutter:
  assets:
    - assets/
  uses-material-design: true
